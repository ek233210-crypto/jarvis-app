name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['JarvisAI.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip project
        run: |
          unzip -q JarvisAI.zip -d work
          DIR=$(dirname "$(find work -name settings.gradle.kts | head -1)")
          echo "PROJ=$DIR" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
